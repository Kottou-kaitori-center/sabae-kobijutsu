<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鯖江古美術交換会</title>
    <style>
        :root {
            --primary-color: #8b0000;
            --bg-color: #fdfbf7;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dcd6cd;
        }

        body {
            font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .header {
            text-align: center;
            border-bottom: 2px double var(--primary-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .badge {
            display: inline-block;
            background-color: #e67e22;
            color: #fff;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 2.2rem;
            margin: 0;
            letter-spacing: 2px;
        }

        .hero-image {
            width: 100%;
            max-width: 600px;
            height: auto;
            display: block;
            margin: 0 auto 20px auto;
        }

        .nav-container {
            text-align: center;
            margin: 20px 0;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav-btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: var(--primary-color);
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border: 2px solid var(--primary-color);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .info-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }

        .info-table th, .info-table td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            text-align: left;
        }

        .info-table th {
            background-color: #f8f5f0;
            color: var(--primary-color);
            width: 25%;
            white-space: nowrap;
            font-weight: bold;
        }

        .sub-note {
            font-size: 0.85rem;
            color: #666;
            display: block;
            margin-top: 4px;
        }

        .notes {
            background-color: #f9f9f9;
            padding: 15px 20px;
            border-left: 4px solid var(--primary-color);
            font-size: 0.9rem;
        }

        .notes p {
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <!-- 1. 最上部（文字のみ・画像と重ならない） -->
    <header class="header">
        <div class="badge">初会！初荷多数！！</div>
        <h1>鯖江古美術交換会</h1>
    </header>

    <!-- 2. 画像 -->
    <img src="サバエイメージ.jpg" alt="鯖江古美術" class="hero-image">

    <!-- 3. ボタンエリア -->
    <div class="nav-container">
        <a href="greeting.html" class="nav-btn">あいさつ</a>
        <a href="exhibition.html" class="nav-btn">ご出品について</a>
        <a href="https://maps.app.goo.gl/sHVNLcG9zZCU2Msf8" target="_blank" class="nav-btn">アクセス</a>
    </div>

    <!-- 4. 詳細情報（元のスタイルに戻し、注記・住所補足を保持） -->
    <div class="container">
        <table class="info-table">
            <tr>
                <th>開催日</th>
                <td>毎月10日</td>
            </tr>
            <tr>
                <th>開始時間</th>
                <td>午前10時〜</td>
            </tr>
            <tr>
                <th>会派</th>
                <td>道具・古美術全般</td>
            </tr>
            <tr>
                <th>会場</th>
                <td>
                    福井県鯖江市東鯖江2丁目621-1
                    <span class="sub-note">（北陸自動車道鯖江インターを降りて車で約3分）</span>
                </td>
            </tr>
        </table>

        <div class="notes">
            <p>※全国の古物商許可証をお持ちの方ならどなたでもご参加いただけます。</p>
            <p>※見学・初回参加ご希望の方はお気軽にお問い合わせください。</p>
        </div>
    </div>

</body>
</html>
