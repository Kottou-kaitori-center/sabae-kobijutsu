<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鯖江古美術交換会</title>
  <style>
    :root {
      --primary-color: #8b0000;
      --bg-color: #fdfbf7;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #dcd6cd;
    }
    
    body {
      font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 30px;
      border: 2px solid var(--primary-color);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .header {
      text-align: center;
      border-bottom: 2px double var(--primary-color);
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    .badge {
      display: inline-block;
      background-color: #e67e22;
      color: #fff;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }

    h1 {
      color: var(--primary-color);
      font-size: 2.2rem;
      margin: 0;
      letter-spacing: 2px;
    }

    .info-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 25px;
    }

    .info-table th, .info-table td {
      padding: 12px 15px;
      border-bottom: 1px solid var(--border-color);
      text-align: left;
    }

    .info-table th {
      background-color: #f8f5f0;
      color: var(--primary-color);
      width: 25%;
      white-space: nowrap;
      font-weight: bold;
    }

    .sub-note {
      font-size: 0.85rem;
      color: #666;
      display: block;
      margin-top: 4px;
    }

    .notes {
      background-color: #f9f9f9;
      padding: 15px 20px;
      border-left: 4px solid var(--primary-color);
      font-size: 0.9rem;
    }

    .notes p {
      margin: 5px 0;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="badge">初会！初荷多数！！</div>
    <h1>鯖江古美術交換会</h1>
  </div>

  <table class="info-table">
    <tr>
      <th>日時</th>
      <td>
        毎月9日 午前9時30分 開催
        <span class="sub-note">（1月、8月は休会になります。）</span>
      </td>
    </tr>
    <tr>
      <th>会場</th>
      <td>福井県鯖江市東鯖江2丁目621-1</td>
    </tr>
    <tr>
      <th>会費</th>
      <td>2千円</td>
    </tr>
    <tr>
      <th>取引</th>
      <td>売歩8分、買歩5分 / 当日現金取引</td>
    </tr>
    <tr>
      <th>競り</th>
      <td>
        1万円から
        <span class="sub-note">※満たない場合はまとめます。</span>
      </td>
    </tr>
    <tr>
      <th>椀伏</th>
      <td>
        10万円から
        <span class="sub-note">競り市終了後に椀伏をいたします。ご参加の程宜しくお願い致します。</span>
      </td>
    </tr>
  </table>

  <div class="notes">
    <p>※初回には会員登録をさせていただきます。その際、古物商許可証番号、インボイス番号の登録が必須となりますのでご準備の程宜しくお願い致します。</p>
    <p>※出品搬入は随時承ります。</p>
  </div>
</div>

</body>
</html>
